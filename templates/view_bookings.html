<!DOCTYPE html>
<html>

<head>
    <title>All Bookings</title>
</head>

<body>

<h1>All Bookings</h1>

<table border="1" cellpadding="8">

<tr>
    <th>Booking ID</th>
    <th>Trekker</th>
    <th>Trek</th>
    <th>Location</th>
    <th>Status</th>
</tr>

{% for booking in bookings %}

<tr>

<td>{{ booking.id }}</td>

<td>{{ booking.user.name }}</td>

<td>{{ booking.trek.trek_name }}</td>

<td>{{ booking.trek.location }}</td>

<td>{{ booking.booking_status }}</td>

</tr>

{% endfor %}

</table>

<br>

<a href="/admin">
    <button>Back to Dashboard</button>
</a>

</body>

</html>
