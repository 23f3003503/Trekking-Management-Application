<!DOCTYPE html>
<html>

<head>
    <title>Available Treks</title>
</head>

<body>

<h1>Available Treks</h1>

<table border="1" cellpadding="8">

<tr>
    <th>Trek Name</th>
    <th>Location</th>
    <th>Difficulty</th>
    <th>Duration</th>
    <th>Available Slots</th>
    <th>Action</th>
</tr>

{% for trek in treks %}

<tr>

<td>{{ trek.trek_name }}</td>

<td>{{ trek.location }}</td>

<td>{{ trek.difficulty }}</td>

<td>{{ trek.duration }}</td>

<td>{{ trek.available_slots }}</td>

<td>

{% if trek.status == "Open" %}

    <a href="/book_trek/{{ trek.id }}">
        <button>Book</button>
    </a>

{% else %}

    Closed

{% endif %}

</td>

</tr>

{% endfor %}

</table>

<br>

<a href="/login">
    <button>Back</button>
</a>

</body>

</html>
