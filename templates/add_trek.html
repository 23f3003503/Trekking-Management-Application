{% extends "base.html" %}

{% block title %}Add Trek{% endblock %}

{% block content %}

<div class="row justify-content-center">

    <div class="col-md-8">

        <div class="card shadow-sm">

            <div class="card-header bg-success text-white">

                <h3 class="mb-0">Add Trek</h3>

            </div>

            <div class="card-body">

                <form method="POST">

                    <div class="mb-3">

                        <label class="form-label">
                            Trek Name
                        </label>

                        <input
                            type="text"
                            name="trek_name"
                            class="form-control"
                            required>

                    </div>

                    <div class="mb-3">

                        <label class="form-label">
                            Location
                        </label>

                        <input
                            type="text"
                            name="location"
                            class="form-control"
                            required>

                    </div>

                    <div class="mb-3">

                        <label class="form-label">
                            Difficulty
                        </label>

                        <select
                            name="difficulty"
                            class="form-select">

                            <option>Easy</option>
                            <option>Moderate</option>
                            <option>Hard</option>

                        </select>

                    </div>

                    <div class="mb-3">

                        <label class="form-label">
                            Duration
                        </label>

                        <input
                            type="text"
                            name="duration"
                            class="form-control"
                            required>

                    </div>

                    <div class="mb-3">

                        <label class="form-label">
                            Available Slots
                        </label>

                        <input
                            type="number"
                            name="available_slots"
                            class="form-control"
                            required>

                    </div>

                    <div class="mb-3">

                        <label class="form-label">
                            Description
                        </label>

                        <textarea
                            name="description"
                            rows="4"
                            class="form-control"></textarea>

                    </div>

                    <button
                        type="submit"
                        class="btn btn-success">

                        Add Trek

                    </button>

                    <a href="/admin" class="btn btn-secondary ms-2">
                        Cancel
                    </a>

                </form>

            </div>

        </div>

    </div>

</div>

{% endblock %}
