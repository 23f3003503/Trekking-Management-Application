{% extends "base.html" %}

{% block title %}Edit Trek{% endblock %}

{% block content %}

<div class="row justify-content-center">

    <div class="col-md-8">

        <div class="card shadow-sm">

            <div class="card-header bg-primary text-white">

                <h3 class="mb-0">Edit Trek</h3>

            </div>

            <div class="card-body">

                <form method="POST">

                    <div class="mb-3">

                        <label class="form-label">
                            Trek Name
                        </label>

                        <input
                            type="text"
                            name="trek_name"
                            class="form-control"
                            value="{{ trek.trek_name }}"
                            required>

                    </div>

                    <div class="mb-3">

                        <label class="form-label">
                            Location
                        </label>

                        <input
                            type="text"
                            name="location"
                            class="form-control"
                            value="{{ trek.location }}"
                            required>

                    </div>

                    <div class="mb-3">

                        <label class="form-label">
                            Difficulty
                        </label>

                        <select
                            name="difficulty"
                            class="form-select">

                            <option value="Easy"
                            {% if trek.difficulty=="Easy" %}selected{% endif %}>
                                Easy
                            </option>

                            <option value="Moderate"
                            {% if trek.difficulty=="Moderate" %}selected{% endif %}>
                                Moderate
                            </option>

                            <option value="Hard"
                            {% if trek.difficulty=="Hard" %}selected{% endif %}>
                                Hard
                            </option>

                        </select>

                    </div>

                    <div class="mb-3">

                        <label class="form-label">
                            Duration
                        </label>

                        <input
                            type="text"
                            name="duration"
                            class="form-control"
                            value="{{ trek.duration }}"
                            required>

                    </div>

                    <div class="mb-3">

                        <label class="form-label">
                            Available Slots
                        </label>

                        <input
                            type="number"
                            name="available_slots"
                            class="form-control"
                            value="{{ trek.available_slots }}"
                            required>

                    </div>

                    <div class="mb-3">

                        <label class="form-label">
                            Assign Staff
                        </label>

                        <select
                            name="assigned_staff"
                            class="form-select">

                            <option value="">
                                -- Select Staff --
                            </option>

                            {% for staff in staff_members %}

                            <option
                                value="{{ staff.id }}"
                                {% if trek.assigned_staff == staff.id %}selected{% endif %}>

                                {{ staff.name }}

                            </option>

                            {% endfor %}

                        </select>

                    </div>

                    <div class="mb-3">

                        <label class="form-label">
                            Description
                        </label>

                        <textarea
                            name="description"
                            rows="5"
                            class="form-control">{{ trek.description }}</textarea>

                    </div>

                    <button
                        type="submit"
                        class="btn btn-primary">

                        Update Trek

                    </button>

                    <a
                        href="/view_treks"
                        class="btn btn-secondary ms-2">

                        Cancel

                    </a>

                </form>

            </div>

        </div>

    </div>

</div>

{% endblock %}
