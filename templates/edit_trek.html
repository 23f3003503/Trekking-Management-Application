<!DOCTYPE html>
<html>
<head>
    <title>Edit Trek</title>
</head>

<body>

<h1>Edit Trek</h1>

<form method="POST">

    <label>Trek Name</label><br>
    <input type="text" name="trek_name" value="{{ trek.trek_name }}" required><br><br>

    <label>Location</label><br>
    <input type="text" name="location" value="{{ trek.location }}" required><br><br>

    <label>Difficulty</label><br>

    <select name="difficulty">

        <option value="Easy"
        {% if trek.difficulty=="Easy" %}selected{% endif %}>
        Easy
        </option>

        <option value="Moderate"
        {% if trek.difficulty=="Moderate" %}selected{% endif %}>
        Moderate
        </option>

        <option value="Hard"
        {% if trek.difficulty=="Hard" %}selected{% endif %}>
        Hard
        </option>

    </select>

    <br><br>

    <label>Duration</label><br>
    <input type="text" name="duration" value="{{ trek.duration }}" required><br><br>

    <label>Available Slots</label><br>
    <input type="number" name="available_slots"
           value="{{ trek.available_slots }}" required><br><br>

    <label>Assign Staff</label><br>

    <select name="assigned_staff">

        <option value="">-- Select Staff --</option>

        {% for staff in staff_members %}

        <option value="{{ staff.id }}"
        {% if trek.assigned_staff == staff.id %}selected{% endif %}>

            {{ staff.name }}

        </option>

        {% endfor %}

    </select>

    <br><br>

    <label>Description</label><br>

    <textarea name="description" rows="5" cols="40">{{ trek.description }}</textarea>

    <br><br>

    <button type="submit">Update Trek</button>

</form>

<br>

<a href="/view_treks">
    <button>Cancel</button>
</a>

</body>
</html>
