<!DOCTYPE html>
<html>

<head>
    <title>Edit Profile</title>
</head>

<body>

<h1>Edit Profile</h1>

<form method="POST">

    <label>Name</label><br>
    <input
        type="text"
        name="name"
        value="{{ user.name }}"
        required>

    <br><br>

    <label>Username</label><br>
    <input
        type="text"
        name="username"
        value="{{ user.username }}"
        required>

    <br><br>

    <label>Password</label><br>
    <input
        type="password"
        name="password"
        value="{{ user.password }}"
        required>

    <br><br>

    <button type="submit">
        Update Profile
    </button>

</form>

<br>

<a href="/trekker">
    <button>Cancel</button>
</a>

</body>

</html>
