{% extends "base.html" %}

{% block title %}Edit Assigned Trek{% endblock %}

{% block content %}

<div class="row justify-content-center">

    <div class="col-md-6">

        <div class="card shadow-sm">

            <div class="card-header bg-primary text-white">

                <h3 class="mb-0">Edit Assigned Trek</h3>

            </div>

            <div class="card-body">

                <form method="POST">

                    <div class="mb-3">

                        <label class="form-label">
                            Available Slots
                        </label>

                        <input
                            type="number"
                            name="available_slots"
                            class="form-control"
                            value="{{ trek.available_slots }}"
                            required>

                    </div>

                    <div class="mb-3">

                        <label class="form-label">
                            Status
                        </label>

                        <select
                            name="status"
                            class="form-select">

                            <option value="Open"
                            {% if trek.status=="Open" %}selected{% endif %}>
                                Open
                            </option>

                            <option value="Closed"
                            {% if trek.status=="Closed" %}selected{% endif %}>
                                Closed
                            </option>

                            <option value="Started"
                            {% if trek.status=="Started" %}selected{% endif %}>
                                Started
                            </option>

                            <option value="Ongoing"
                            {% if trek.status=="Ongoing" %}selected{% endif %}>
                                Ongoing
                            </option>

                            <option value="Completed"
                            {% if trek.status=="Completed" %}selected{% endif %}>
                                Completed
                            </option>

                        </select>

                    </div>

                    <button
                        type="submit"
                        class="btn btn-primary">

                        Update Trek

                    </button>

                    <a
                        href="/staff"
                        class="btn btn-secondary ms-2">

                        Back

                    </a>

                </form>

            </div>

        </div>

    </div>

</div>

{% endblock %}
